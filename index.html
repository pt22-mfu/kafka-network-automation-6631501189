<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kafka Network Automation</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #edf2f7;
      color: #183149;
      font: 16px system-ui, sans-serif;
    }

    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 24px;
    }

    .tag {
      color: #087f83;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 2px;
    }

    h1 { font-size: 36px; margin: 12px 0; }
    p { color: #5d7183; line-height: 1.6; }

    .panel {
      background: white;
      border: 1px solid #d5e0ea;
      border-radius: 16px;
      padding: 24px;
      margin: 24px 0;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    label { font-weight: 600; }

    select {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0 20px;
      border: 1px solid #b8c9d6;
      border-radius: 8px;
      font: inherit;
      background: white;
    }

    button {
      background: #087f83;
      color: white;
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }

    button:disabled { opacity: .5; cursor: wait; }

    pre {
      background: #132b40;
      color: #bfeee3;
      padding: 20px;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      min-height: 160px;
      font-size: 14px;
    }

    .entry {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      border-top: 1px solid #e0e8ee;
      padding: 12px 0;
      align-items: center;
    }

    .entry button {
      background: #e6f3f2;
      color: #087f83;
      font-size: 13px;
    }

    small { overflow-wrap: anywhere; }
    #status { margin-top: 18px; font-weight: 600; }

    @media (max-width: 600px) {
      .fields { grid-template-columns: 1fr; gap: 0; }
      h1 { font-size: 27px; }
      .entry { align-items: flex-start; }
    }
  </style>
</head>

<body>
  <main>
    <div class="tag">6631501189 · PHYO THANT KYAW</div>
    <h1>Kafka Network Automation</h1>
    <p>
      Select a GNS3 router and run a diagnostic command
      through the Kafka worker.
    </p>

    <section class="panel">
      <form id="request">
        <div class="fields">
          <label>
            Router
            <select id="router"></select>
          </label>
          <label>
            Command
            <select id="action"></select>
          </label>
        </div>
        <button id="run" disabled>Run command</button>
      </form>

      <div id="status" role="status" aria-live="polite">
        Connecting to backend…
      </div>
      <small id="identifier"></small>
      <pre id="output">Your router output will appear here.</pre>
    </section>

    <section class="panel">
      <h2>Job history</h2>
      <div id="history">Loading…</div>
    </section>
  </main>

  <script>
    const byId = id => document.getElementById(id);
    let current = null;
    let busy = false;

    async function api(url, options) {
      const response = await fetch(url, options);
      const data = await response.json();

      if (!response.ok) {
        const error = new Error(
          typeof data.detail === "string"
            ? data.detail
            : JSON.stringify(data.detail)
        );
        error.details = data.detail;
        throw error;
      }

      return data;
    }

    function display(job) {
      byId("status").textContent = job.router + " / " + job.status;
      byId("identifier").textContent = "Job: " + job.id;

      byId("output").textContent = job.output || (
        job.status === "queued"
          ? "Waiting for the Kafka worker…"
          : job.status === "running"
            ? "Executing over SSH…"
            : "No output yet."
      );
    }

    async function refresh() {
      if (busy) return;
      busy = true;

      try {
        const jobs = await api("/jobs");
        byId("history").replaceChildren();

        if (!jobs.length) {
          byId("history").textContent = "No jobs submitted yet.";
        }

        for (const job of jobs) {
          const row = document.createElement("div");
          row.className = "entry";

          const label = document.createElement("span");
          label.textContent =
            job.router + " · " + job.action + " · " + job.status;

          const button = document.createElement("button");
          button.textContent = "View";
          button.onclick = () => {
            current = job.id;
            display(job);
          };

          row.append(label, button);
          byId("history").append(row);
        }

        if (current) {
          const selected = jobs.find(job => job.id === current)
            || await api("/jobs/" + encodeURIComponent(current));
          display(selected);
        }
      } catch (error) {
        byId("status").textContent = "Refresh failed: " + error.message;
      } finally {
        busy = false;
      }
    }

    byId("request").onsubmit = async event => {
      event.preventDefault();
      byId("run").disabled = true;
      byId("status").textContent = "Submitting…";

      try {
        const job = await api("/jobs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            router: byId("router").value,
            action: byId("action").value
          })
        });

        current = job.id;
        display(job);
        await refresh();
      } catch (error) {
        current = error.details?.id || null;
        byId("status").textContent = error.message;

        if (current) {
          byId("identifier").textContent = "Job: " + current;
        }
      } finally {
        byId("run").disabled = false;
      }
    };

    (async () => {
      try {
        const options = await api("/options");

        for (const router of options.routers) {
          byId("router").add(new Option(router, router));
        }

        for (const [key, command] of Object.entries(options.commands)) {
          byId("action").add(new Option(command, key));
        }

        byId("status").textContent = "Ready";
        byId("run").disabled = false;

        await refresh();
        setInterval(refresh, 2000);
      } catch (error) {
        byId("status").textContent =
          "Backend unavailable: " + error.message;
      }
    })();
  </script>
</body>
</html>
